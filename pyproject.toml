[tool.flet]
name = "Zenith AI"
description = "Gelişmiş Yapay Zeka Asistanı"
icon = "icon.png"

[tool.flet.android]
package_name = "com.zenith.ai"
permissions = [
    "INTERNET",
    "CAMERA",
    "RECORD_AUDIO",
    "MODIFY_AUDIO_SETTINGS",
    "ACCESS_FINE_LOCATION",
    "ACCESS_COARSE_LOCATION",
    "WRITE_EXTERNAL_STORAGE",
    "READ_EXTERNAL_STORAGE",
    "WAKE_LOCK"
]
